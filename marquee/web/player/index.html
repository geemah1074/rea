<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Marquee Player</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="player.css">
  <script src="../shared/config.js"></script>
  <script src="../shared/vendor/supabase-2.45.4.js"></script>
  <script type="module" src="player.js"></script>
</head>
<body>
  <div id="stage" aria-live="off">
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
  </div>

  <section id="panel" class="panel" hidden>
    <div class="panel-inner">
      <p class="wordmark">MARQUEE</p>
      <h1 id="panel-title">Starting…</h1>
      <p id="panel-code" class="code" hidden></p>
      <p id="panel-body" class="panel-body"></p>
      <p id="panel-meta" class="panel-meta"></p>
    </div>
  </section>

  <div id="identify" class="identify" hidden>
    <span class="tally"></span><span id="identify-name"></span>
  </div>
  <div id="offline-dot" class="offline-dot" hidden title="Offline: playing saved content"></div>
</body>
</html>
